[Information]
Updated = February 24, 2023
Description = Redfish Event Listener Tool Simple Config

[SystemInformation]
ListenerIP = 0.0.0.0
ListenerPort = 443
UseSSL = on

[CertificateDetails]
certfile = cert.pem
keyfile = server.key

[SubscriptionDetails]
# IPv4: https://<ListenerIP>/
# IPv6: https://[<ListenerIPv6>]/
Destination = https://<ListenerIP>/
Context = Public

[ListenerAuthentication]
UserName = username
Password = password

[ServerInformation]
# IPv4: ["https://<RedfishIP>"]
# IPv6: ["https://[<RedfishIPv6>]"]
ServerIPs = ["https://<RedfishIP>"]
UserNames = ["Username1"]
Passwords = ["Password1"]
LoginType = ["Session"]